# Netlify configuration — The House Always Wins
# The claim validator runs on every deploy: a malformed or uncited claim
# fails the build, so bad data never reaches production.

[build]
  publish = "."
  command = "node tools/validate.js"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
